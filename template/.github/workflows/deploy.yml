# Gate G5: every merge to main builds and then waits for a human to approve
# the `production` environment before deploying.
# Configure in GitHub → Settings → Environments → production:
#   - Required reviewers: the product owner (and backups)
#   - Deployment branches: main only
#   - Secrets: production credentials live ONLY here
name: Deploy

on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "**.md"
  workflow_dispatch:
    inputs:
      reason:
        description: "Why are you deploying manually? (redeploy / rollback / hotfix)"
        required: true

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify:
    name: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      # TODO(setup): same runtime setup as ci.yml
      - run: make setup
      - run: make check

  deploy:
    name: deploy-production
    needs: verify
    runs-on: ubuntu-24.04
    environment:
      name: production
      url: ${{ vars.PRODUCTION_URL }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      # TODO(setup): same runtime setup as ci.yml
      - run: make setup

      - name: Deploy
        run: make deploy
        env:
          # TODO(setup): map the production environment's secrets your deploy needs, e.g.
          # DEPLOY_TOKEN: ${{ secrets.DEPLOY_TOKEN }}
          DEPLOY_REASON: ${{ github.event.inputs.reason || 'merge to main' }}

      - name: Smoke test
        run: make smoke
        env:
          SMOKE_URL: ${{ vars.PRODUCTION_URL }}
