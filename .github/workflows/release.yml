# Publishes a release for a version tag (vX.Y.Z), whether the tag is pushed with git
# or created by publishing a release in GitHub's web page.
# Checks that the tag, VERSION, the tool and the CHANGELOG agree, runs the tests,
# then attaches the changelog notes and a zip of the kit to the release.
name: Release

on:
  push:
    tags: ["v*.*.*"]
  release:
    types: [published]

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Check versions agree
        run: |
          tag="${GITHUB_REF_NAME#v}"
          file="$(tr -d '[:space:]' < VERSION)"
          tool="$(python -c "import re;print(re.search(r'^VERSION = \"([^\"]+)\"', open('template/tools/haam/haam.py').read(), re.M).group(1))")"
          echo "tag=$tag VERSION=$file tool=$tool"
          if [ "$tag" != "$file" ] || [ "$tag" != "$tool" ]; then
            echo "::error::Tag, VERSION and haam.py VERSION must match"
            exit 1
          fi
          if ! grep -q "^## \[$tag\]" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no section for $tag"
            exit 1
          fi

      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: "8.24.2"
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | sudo tar -xz -C /usr/local/bin gitleaks

      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: Build release notes and zip
        run: |
          tag="${GITHUB_REF_NAME#v}"
          awk -v v="$tag" '
            $0 ~ "^## \\[" v "\\]" {on=1; next}
            on && /^## \[/ {exit}
            on {print}
          ' CHANGELOG.md > notes.md
          printf '\n---\nInstall: see the README. The kit is the template/ folder.\n' >> notes.md
          git archive --format=zip --prefix="haam-kit-${GITHUB_REF_NAME}/" -o "haam-kit-${GITHUB_REF_NAME}.zip" "$GITHUB_REF_NAME"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            # Release already published (e.g. from the web page): fill in notes and the zip.
            gh release upload "$GITHUB_REF_NAME" "haam-kit-${GITHUB_REF_NAME}.zip" --clobber
            gh release edit "$GITHUB_REF_NAME" --title "HAAM kit ${GITHUB_REF_NAME}" --notes-file notes.md
          else
            gh release create "$GITHUB_REF_NAME" "haam-kit-${GITHUB_REF_NAME}.zip" \
              --title "HAAM kit ${GITHUB_REF_NAME}" --notes-file notes.md --verify-tag
          fi
