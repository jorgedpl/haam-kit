# CI for the HAAM kit repository itself (the kit's own workflows live in template/.github
# and only run in projects that install the kit).
# Pushes and PRs test on Linux only. macOS runners count 10 minutes for every minute they run, so the
# macOS jobs run once a week and on demand (Actions → Test → Run workflow), not on every push.
name: Test

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 6 * * 1"    # Mondays: the full matrix, macOS included
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same branch or PR replaces a run that's still going.
concurrency:
  group: test-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  GITLEAKS_VERSION: "8.24.2"

jobs:
  tool:
    name: setup tool (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON((github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && '["ubuntu-24.04", "macos-15"]' || '["ubuntu-24.04"]') }}
        python: ["3.9", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install gitleaks (Linux)
        if: runner.os == 'Linux'
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | sudo tar -xz -C /usr/local/bin gitleaks
      - name: Install gitleaks (macOS)
        if: runner.os == 'macOS'
        run: brew install gitleaks
      - name: Run tests
        run: python -m unittest discover -s tests -v

  lint:
    name: lint workflows and scripts
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: actionlint (kit and repo workflows)
        run: |
          bash <(curl -sSfL https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash)
          ./actionlint -color template/.github/workflows/*.yml .github/workflows/*.yml
      - name: shell syntax
        run: |
          for f in install.sh template/scripts/*.sh template/.githooks/* template/.claude/hooks/*.sh; do
            bash -n "$f"
          done
      - name: Python syntax (oldest supported)
        uses: actions/setup-python@v5
        with:
          python-version: "3.9"
      - run: python -m py_compile template/tools/haam/haam.py tests/*.py
