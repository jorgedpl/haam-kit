# Gate G4 enforcement: a PR can only merge to main when a human has passed UAT
# (label `uat-passed`) or a human has overridden the gate (label `gate-override`
# plus a PR comment starting with "OVERRIDE:").
# Docs-only PRs (docs/**, *.md) are exempt.
# Branch protection on `main` requires the status check named "release-gate".
name: Gates

on:
  pull_request:
    types: [opened, reopened, synchronize, labeled, unlabeled, ready_for_review, edited]
  issue_comment:
    types: [created, edited]

permissions:
  contents: read
  pull-requests: read
  issues: read
  statuses: write

jobs:
  evaluate:
    # The job itself always succeeds; the result is published as the commit
    # status "release-gate", which branch protection requires. This keeps it
    # correct for comment events too (which don't run against the PR commit).
    name: evaluate release gate
    # For comments, only run when the comment is on a PR.
    if: github.event_name == 'pull_request' || github.event.issue.pull_request
    runs-on: ubuntu-latest
    steps:
      - name: Check UAT / override
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const number = context.payload.pull_request
              ? context.payload.pull_request.number
              : context.payload.issue.number;

            const { data: pr } = await github.rest.pulls.get({ owner, repo, pull_number: number });
            const labels = pr.labels.map(l => l.name);

            // Docs-only PRs are exempt.
            const files = await github.paginate(github.rest.pulls.listFiles, { owner, repo, pull_number: number });
            const docsOnly = files.length > 0 && files.every(f =>
              f.filename.startsWith('docs/') || f.filename.endsWith('.md'));

            let state = 'failure';
            let description = 'Waiting for UAT: needs label uat-passed (or gate-override with reason)';

            if (docsOnly) {
              state = 'success';
              description = 'Docs-only change: UAT not required';
            } else if (labels.includes('uat-passed')) {
              state = 'success';
              description = 'UAT passed';
            } else if (labels.includes('gate-override')) {
              const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number: number });
              const reason = comments.find(c => /^\s*(OVERRIDE|EMERGENCY BYPASS):/i.test(c.body));
              if (reason) {
                state = 'success';
                description = `Gate overridden by ${reason.user.login}`;
              } else {
                description = 'gate-override label present but no "OVERRIDE: <reason>" comment';
              }
            }

            // Post the status on the PR head commit so it works for comment events too.
            await github.rest.repos.createCommitStatus({
              owner, repo, sha: pr.head.sha, state, description: description.slice(0, 140),
              context: 'release-gate',
            });

            core.info(`release-gate → ${state}: ${description}`);
